# 사용법은 robotics/CLAUDE.md 1절 참고.
#   docker compose build          이미지 만들기 (처음 한 번, 20~40분)
#   docker compose run --rm ros   컨테이너 셸 열기

services:
  ros:
    build: .
    image: robotics-jazzy:latest

    # ROS 2는 UDP 멀티캐스트로 노드를 찾는다.
    # host 네트워크가 아니면 컨테이너 밖 노드나 실물 터틀봇을 못 본다.
    network_mode: host
    ipc: host

    working_dir: /work
    volumes:
      # 호스트의 robotics/examples 를 컨테이너의 /work 로 붙인다.
      # 파일 편집은 호스트에서, 빌드와 실행은 컨테이너에서 한다.
      - ../examples:/work
      # RViz2·Gazebo 창을 호스트 화면에 띄우기 위한 연결
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # 같은 망의 다른 사람과 노드가 섞이지 않게 번호를 나눈다
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}

    stdin_open: true
    tty: true
    command: bash
